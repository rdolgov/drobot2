seed: 4821
device: cuda:0
num_steps_per_env: 64
max_iterations: 300
empirical_normalization: {}
obs_groups:
  actor:
  - policy
  critic:
  - critic
clip_actions: 1.0
check_for_nan: true
save_interval: 25
experiment_name: drobot_commanded_walk_forward_v17b_rectangular_progress_direct
run_name: manual-headless
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: true
load_run: _workflow-bootstrap$
load_checkpoint: model_0[.]pt$
class_name: OnPolicyRunner
actor:
  class_name: MLPModel
  hidden_dims:
  - 256
  - 256
  activation: elu
  obs_normalization: false
  distribution_cfg:
    class_name: BetaDistribution
    action_range: !!python/tuple
    - -1.0
    - 1.0
critic:
  class_name: MLPModel
  hidden_dims:
  - 256
  - 256
  activation: elu
  obs_normalization: true
  distribution_cfg: null
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.0003
  schedule: adaptive
  gamma: 0.995
  lam: 0.95
  entropy_coef: 0.001
  desired_kl: 0.015
  max_grad_norm: 0.5
  optimizer: adam
  value_loss_coef: 0.5
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  share_cnn_encoders: false
  rnd_cfg: null
  symmetry_cfg: null
policy: {}
