schema_version: 1
part_id: tpu_fork_shoe
source: drobot_cad/parts/tpu_fork_shoe.py
fit_preview: drobot_cad/assembly/tpu_fork_shoe_fit_preview.py
units: mm

coordinate_system:
  origin: distal fork revolute-axis center
  positive_x: outward from the lower leg toward the contact pad
  positive_y: inherited upper-arm transverse direction
  positive_z: along the fork axis and attachment rods

attachment:
  source_interface: upper_arm frame_distal_fork_axis
  existing_hole_diameter_mm: 3.0
  shoe_clearance_hole_diameter_mm: 3.4
  square_pattern_pitch_mm: 9.899494
  pattern_offset_xy_mm: 4.949747
  available_holes: 4
  recommended_used_holes: 2 diagonal
  recommended_hardware: 2x M3 x 75 mm threaded rods with washers and nylon lock nuts
  main_hub_clearance_per_side_mm: 0.4
  rod_pad_clearance_per_side_mm: 0.4

contact_body:
  material_intent: TPU 95A first prototype
  type: hollow_ellipsoidal_rocker
  center_x_mm: 33.5
  outer_radii_xyz_mm: [27.0, 24.0, 24.0]
  inner_radii_xyz_mm: [23.0, 20.0, 20.0]
  contact_surface: continuously_convex_no_flat_pad
  nominal_shell_wall_mm: 4.0
  side_vent_radius_mm: 5.5
  nose_x_mm: 60.5
  direct_hub_overlap_x_mm: 5.0
  junction: ellipsoid_fused_directly_into_attachment_hub

generated_baseline:
  status: regenerated_2026-08-10_near_round_not_geometry_verified
  solid_count: 1
  bounds:
    min_xyz_mm: [-11.5, -24.0, -24.0]
    max_xyz_mm: [60.5, 24.0, 24.0]
    size_xyz_mm: [72.0, 48.0, 48.0]
  kernel_tolerance_mm: 0.05

acceptance_tests:
  - geometry is one connected valid solid
  - four M3 clearance axes match the existing distal fork pattern
  - two diagonal rods prevent shoe rotation without modifying the leg
  - hub and rod pads each preserve 0.4 mm clearance per fork side
  - installed TPU part has no positive-volume collision with the existing leg
  - oval rocker has a continuously convex contact surface and 4 mm principal-axis shell wall
  - ellipsoid overlaps the attachment hub by 5 mm with no intermediate cylindrical neck

limitations:
  - geometry validation does not establish payload rating or fatigue life
  - fork holes may need reaming to pass M3 rod on an existing printed leg
  - TPU hardness, wall count, infill, and nut torque require physical testing
