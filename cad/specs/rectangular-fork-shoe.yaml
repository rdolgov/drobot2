acceptance_tests:
  - geometry is one connected positive-volume solid
  - sole contact face is a flat 100 x 60 mm rounded rectangle
  - four 3.4 mm bores match the existing 9.899494 mm square fork pattern
  - installed shoe has no positive-volume collision with the existing leg
  - 9 mm driver envelopes approach every rod from both sides without touching shoe geometry
  - nearest reinforcement remains at least 10.55 mm outside each driver envelope
  - raised central neck leaves the fork bottom open without an external cup
  - central hub preserves 0.4 mm clearance per fork side

limitations:
  - generated geometry passed software validity and installed interference checks but has not been physically fitted
  - no slicing, print validation, motion simulation, or hardware test has been performed
  - PLA strength depends on print orientation, layer adhesion, wall count, and infill
  - longer sole increases distal bending moment and swing-clearance requirements
  - hard PLA requires a thin bonded traction layer on smooth floors
  - controller effective foot length must be updated after final tread thickness is measured
