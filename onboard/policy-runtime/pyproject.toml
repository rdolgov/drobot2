[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drobot-policy-runtime"
version = "0.1.0"
description = "Isaac-trained Drobot walking policy runtime for Raspberry Pi"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "onnxruntime>=1.24.1",
]

[project.optional-dependencies]
bno085 = [
  "adafruit-blinka>=9.2.0",
  "adafruit-circuitpython-bno08x>=1.3.3",
  "adafruit-extended-bus>=1.0.2",
]

[project.scripts]
drobot-policy-print = "drobot_policy_runtime.cli:main"
drobot-policy-web = "drobot_policy_runtime.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drobot_policy_runtime = ["web_static/*"]
