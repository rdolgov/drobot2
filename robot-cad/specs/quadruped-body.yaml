schema_version: 1
assembly_id: four_leg_st3215_quadruped
units:
  length: mm
  angle: deg

coordinate_system:
  origin: center of body footprint at bottom surface
  positive_x: robot front
  positive_y: robot left
  positive_z: up

body:
  exterior_xyz_mm: [220.0, 170.0, 100.0]
  base_height_mm: 96.0
  wall_mm: 3.2
  floor_mm: 4.0
  corner_radius_mm: 12.0
  structural_split_required: false
  separately_printed_parts:
    - open_top_body_base
    - removable_lid
    - removable_electronics_tray

hip_interfaces:
  plate_source: robot_cad/parts/st3215_hip_body_mount.py
  plate_size_mm: [76.0, 76.0, 6.0]
  plate_centers_x_mm: [-60.0, 60.0]
  body_side_faces_y_mm: [-85.0, 85.0]
  center_z_mm: 50.0
  body_hole_diameter_mm: 4.8
  hole_rows_x_mm: [-90.0, -30.0, 30.0, 90.0]
  hole_rows_z_mm: [20.0, 80.0]
  local_backing_thickness_mm: 6.0

internal_layout:
  battery_clear_envelope_xyz_mm: [168.0, 68.0, 46.0]
  battery_reference:
    target: LeKiwi 12 V battery
    bom_label: 12 V 5 Ah KBT pack
    upstream_mesh_label: Battery 5.2 Ah DC5521 Plug v2
    immutable_mesh: vendor/references/lekiwi/lekiwi_12v_5ah_battery_reference.stl
    installed_envelope_xyz_mm: [70.0, 66.0, 40.0]
    installed_center_xyz_mm: [0.0, 0.0, 24.0]
    source_mesh_bounds_xyz_mm: [40.0000002, 66.0000002, 70.0000002]
    side_clearance_per_side_mm: 1.0
    clearance_below_electronics_tray_mm: 12.0
    status: geometry_reference_only_electrical_and_bms_rating_not_validated
  battery_rail_clearance_per_side_mm: 1.0
  battery_retaining_rail_height_mm: 8.0
  electronics_tray_xyz_mm: [180.0, 132.0, 3.0]
  electronics_tray_bottom_z_mm: 56.0
  electronics_clear_height_below_lid_mm: 34.0
  electronics_status: servo_adapter_and_imu_selected_other_compute_and_power_parts_provisional
  servo_bus_adapter:
    selected_board: Waveshare Bus Servo Adapter (A)
    protocol: USB_or_UART_half_duplex_serial_bus_not_CAN
    exact_reference: vendor/electronics/waveshare_bus_servo_adapter_a.step
    full_assembly_geometry: measured_exact_envelope_proxy
    nominal_board_xy_mm: [42.0, 33.0]
    detailed_envelope_xyz_mm: [42.02417808, 33.81628938, 14.59999982]
    product_mass_kg: 0.016
    board_center_xy_mm: [-48.0, 32.0]
    board_datum_z_mm: 63.0
    mounting_hole_diameter_mm: 2.5
    mounting_pattern_xy_mm: [37.0, 28.0]
    fastener_nominal: M2
    tray_clearance_diameter_mm: 2.4
    standoff_outer_diameter_mm: 6.0
    standoff_height_mm: 4.0
    underside_clearance_above_tray_mm: 0.4
    clearance_below_lid_locator_mm: 19.0
    note: exact standalone STEP is retained; full robot uses its measured envelope because the 117-solid board cannot be nested reliably in the 290-solid XCAF assembly
  body_imu:
    selected_board: Adafruit BNO085 STEMMA QT product 4754
    exact_reference: vendor/sensors/adafruit_bno085_stemma_qt.step
    product_envelope_xyz_mm: [25.4, 22.86, 4.53]
    product_mass_kg: 0.0025
    sensing_element_center_xyz_mm: [0.0, 0.0, 65.16]
    board_bottom_z_mm: 63.0
    connector_direction: front_and_rear
    body_axis_alignment: [+X, +Y, +Z]
    fastener_nominal: M2_nylon
    tray_clearance_diameter_mm: 2.4
    board_hole_diameter_mm: 2.5
    mount_pattern_xy_mm:
      - [-10.163, -9.695]
      - [-10.163, 8.085]
      - [10.157, -9.695]
      - [10.157, 8.085]
    standoff_outer_diameter_mm: 6.0
    standoff_height_mm: 4.0
    clearance_below_lid_mm: 25.47
    note: sensing package is centred; use a no-magnetometer game rotation vector near servo power wiring
  lid_fasteners:
    nominal: M3
    boss_quantity: 4
    insert_pilot_diameter_mm: 4.2
    status: pilot_must_be_adjusted_to_selected_heat_set_insert

wiring_access:
  lid_leg_ports:
    quantity: 4
    shape: rounded_slot
    overall_xy_mm: [26.0, 14.0]
    centers_x_mm: [-60.0, 60.0]
    centers_y_mm: [-76.0, 76.0]
    note: one top-entry port beside each leg
  side_service_ports:
    quantity: 2
    shape: rounded_slot
    overall_xz_mm: [24.0, 14.0]
    centers_xyz_mm:
      - [0.0, -85.0, 50.0]
      - [0.0, 85.0, 50.0]
    note: centered between the front and rear hip backing pads

utility_mounting:
  fastening_note: clearance through-holes for bolts, washers, and nuts; not printed threads
  lid_top:
    m2_clearance_diameter_mm: 2.4
    m2_centers_xy_mm:
      - [-30.0, -24.0]
      - [-30.0, 24.0]
      - [30.0, -24.0]
      - [30.0, 24.0]
    m3_clearance_diameter_mm: 3.4
    m3_centers_xy_mm:
      - [-90.0, -24.0]
      - [-90.0, 24.0]
      - [90.0, -20.0]
      - [90.0, 0.0]
      - [90.0, 20.0]
    front_pattern_note: three-hole LeKiwi camera-mount row at 20 mm pitch
  body_bottom:
    m2_clearance_diameter_mm: 2.4
    m2_centers_xy_mm:
      - [-35.0, -68.0]
      - [-35.0, 68.0]
      - [35.0, -68.0]
      - [35.0, 68.0]
    m3_clearance_diameter_mm: 3.4
    m3_centers_xy_mm:
      - [-75.0, -68.0]
      - [-75.0, 68.0]
      - [75.0, -68.0]
      - [75.0, 68.0]
    placement_note: outside the battery retaining rail and clear of tray standoffs

camera_mount:
  target_camera: Arducam 5MP Wide Angle USB Camera, ASIN B0972KK7BC
  compatibility: SIGRobotics-UIUC LeKiwi base_camera_mount.stl
  robot_side_interface:
    fastener_nominal: M3
    clearance_diameter_mm: 3.4
    center_x_mm: 90.0
    centers_y_mm: [-20.0, 0.0, 20.0]
    pitch_y_mm: 20.0
  camera_side_interface:
    fastener_nominal: M2.5
    quantity: 2
    note: retained unchanged in the upstream LeKiwi mount
  cable_port:
    shape: rounded_slot
    overall_xy_mm: [20.0, 12.0]
    center_xy_mm: [65.0, 0.0]
    note: replaces the overlapping front-center 30 x 4 mm ventilation slot
  reference_mount:
    file: vendor/references/lekiwi/base_camera_mount.stl
    bounds_xyz_mm: [16.661073, 48.0, 45.184589]
    status: immutable upstream printable reference
  fit_preview:
    source: robot_cad/assembly/lekiwi_camera_body_fit_preview.py
    step: exports/step/lekiwi_camera_body_fit_preview.step
    note: green mount and purple camera are positioning envelopes, not manufacturing geometry
  simulation:
    camera_link_origin_xyz_m: [0.09, 0.0, 0.1]
    optical_origin_from_camera_link_xyz_m: [0.0245, 0.0, 0.023]
    optical_origin_from_base_xyz_m: [0.1145, 0.0, 0.123]
    optical_frame_rpy_rad: [-1.570796327, 0.0, -1.570796327]
    isaac_camera_prim: /World/Robot/Geometry/base_link/lekiwi_camera
    resolution_hw: [480, 640]
    tick_rate_hz: 30.0
    horizontal_fov_deg: 95.0
    annotators: [rgb, distance_to_image_plane]

x2d_print_fit:
  official_main_nozzle_volume_xyz_mm: [256.0, 256.0, 260.0]
  official_auxiliary_or_shared_volume_xyz_mm: [235.5, 256.0, 256.0]
  official_source: https://blog.bambulab.com/xcellence-made-simple-bambu-lab-presents-the-x2d/
  official_area_explanation: https://blog.bambulab.com/two-extruders-one-purpose-what-is-x2d-direct-drive-extrusion-and-auxiliary-extrusion/
  recommended_brim_mm: 5.0
  base_with_brim_xyz_mm: [230.0, 180.0, 96.0]
  fits_main_nozzle: true
  fits_shared_dual_nozzle_region: true
  structural_body_split_required: false

preview_stance:
  note: preview angles are not validated joint limits
  front_left_deg: [15.0, -20.0, -35.0]
  rear_left_deg: [15.0, 20.0, 35.0]
  front_right_deg: [15.0, 20.0, 35.0]
  rear_right_deg: [15.0, -20.0, -35.0]

outputs:
  body_base:
    source: robot_cad/parts/quadruped_body.py
    step: exports/step/quadruped_body_base.step
    stl: exports/stl/quadruped_body_base.stl
    3mf: exports/3mf/quadruped_body_base.3mf
  lid:
    source: robot_cad/parts/quadruped_body_lid.py
    step: exports/step/quadruped_body_lid.step
    stl: exports/stl/quadruped_body_lid.stl
    3mf: exports/3mf/quadruped_body_lid.3mf
  electronics_tray:
    source: robot_cad/parts/quadruped_electronics_tray.py
    step: exports/step/quadruped_electronics_tray.step
    stl: exports/stl/quadruped_electronics_tray.stl
    3mf: exports/3mf/quadruped_electronics_tray.3mf
  body_imu_reference:
    source: robot_cad/parts/adafruit_bno085.py
    step: exports/step/adafruit_bno085_stemma_qt.step
    stl: exports/stl/adafruit_bno085_stemma_qt.stl
    printable: false
  body_battery_reference:
    source: robot_cad/parts/lekiwi_12v_battery_reference.py
    step: exports/step/lekiwi_12v_battery_reference.step
    printable: false
  servo_bus_adapter_reference:
    source: robot_cad/parts/waveshare_bus_servo_adapter_a.py
    step: exports/step/waveshare_bus_servo_adapter_a.step
    printable: false
  body_imu_fit_preview:
    source: robot_cad/assembly/quadruped_imu_tray_fit_preview.py
    step: exports/step/quadruped_imu_tray_fit_preview.step
    printable: false
  body_hardware_fit_preview:
    source: robot_cad/assembly/quadruped_body_hardware_fit_preview.py
    step: exports/step/quadruped_body_hardware_fit_preview.step
    printable: false
  complete_assembly:
    source: robot_cad/assembly/quadruped_robot.py
    fusion_step: exports/step/quadruped_robot_fusion360.step
    compatibility_step: exports/step/quadruped_robot.step
    printable: false

acceptance_tests:
  - base, lid, and electronics tray are each one connected valid solid
  - base has sixteen body-side M4 clearance holes aligned to four hip plates
  - two symmetric rounded body-side wiring ports remain clear of the hip plates
  - lid has four rounded leg wiring ports, four M2 utility holes, two rear M3 utility holes, and a three-hole LeKiwi camera row
  - LeKiwi camera row has 20 mm pitch and the dedicated 20 x 12 mm cable slot is open
  - body floor has eight symmetric M2/M3 utility holes outside the battery rail
  - four leg root plates sit flush to the two body side faces
  - battery clear envelope and electronics tray fit inside the body
  - LeKiwi battery reference has 1 mm side clearance and 12 mm tray clearance
  - exact Waveshare serial-bus adapter seats on a 37 x 28 mm four-hole pattern
  - servo adapter clears the tray, lid locator, and body-centred IMU
  - BNO085 sensing element is body-centred, axis-aligned, and clear of the lid
  - four M2 tray holes align to the exact Adafruit BNO085 mounting pattern
  - base with recommended brim fits the X2D shared dual-nozzle region
  - complete assembly preserves the battery, controller, IMU, camera, and four labeled seven-component leg modules
