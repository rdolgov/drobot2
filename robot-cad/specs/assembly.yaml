schema_version: 1
assembly_id: dual_upper_arm_st3215
units:
  length: mm
  angle: deg

root_component: upper_arm_link_1

components:
  - id: upper_arm_link_1
    source: robot_cad/parts/upper_arm.py
    status: migrated
  - id: upper_arm_link_2
    source: robot_cad/parts/upper_arm.py
    relationship: connected to upper_arm_link_1 at st3215_elbow_joint
    status: migrated
  - id: st3215_base_servo
    source: vendor/servos/waveshare_feetech_st3215_servo.step
    relationship: installed in upper_arm_link_1 rear motor bay
    status: exact_catalog_model
  - id: st3215_elbow_servo
    source: vendor/servos/waveshare_feetech_st3215_servo.step
    relationship: installed in upper_arm_link_2 and aligned to upper_arm_link_1 fork
    status: exact_catalog_model

connections:
  - id: st3215_elbow_joint
    type: revolute
    parent_component: upper_arm_link_1
    parent_frame: frame_distal_fork_axis
    child_component: upper_arm_link_2
    child_frame: frame_st3215_output_axis
    axis: [0.0, 0.0, 1.0]
    preview_angle_deg: 35.0
    minimum_deg: -90.0
    maximum_deg: 90.0

final_assembly:
  source: robot_cad/assembly/robot_arm.py
  output: exports/step/robot_arm.step
  printable: false

fit_previews:
  - id: st3215_motor_bay_fit_preview
    source: robot_cad/assembly/st3215_motor_bay_fit_preview.py
    printable: false
  - id: upper_arm_st3215_fit_preview
    source: robot_cad/assembly/upper_arm_st3215_fit_preview.py
    printable: false

acceptance_tests:
  - printable generators each return one valid connected solid
  - fit previews preserve labeled bay/arm and catalog-servo occurrences
  - elbow servo output axis coincides with the root arm distal fork axis
  - final assembly preserves two labeled upper arms and two exact ST3215 servos
  - each upper-arm occurrence retains its integral servo-output fork
  - vendor STEP checksums match vendor/README.md
  - generated bounds match the migrated geometry baselines
  - the exact servo variant is confirmed before production fabrication
