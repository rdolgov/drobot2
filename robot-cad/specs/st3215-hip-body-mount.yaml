schema_version: 1
part_id: st3215_hip_body_mount
units:
  length: mm

status: first_pass_for_position_review
printable: true

coordinate_system:
  origin: reusable motor-fork attachment datum center
  positive_x: from body plate toward fork output joint
  positive_y: across fork width
  positive_z: vertical across fork attachment edge

source_components:
  motor_fork: robot_cad/parts/st3215_servo_output_fork.py
  fork_configuration: full_fork_with_negative_x_half_oval_extension
  geometry_policy: reuse the complete motor fork unchanged

mounting_plate:
  plane: YZ
  center_xyz_mm: [-29.0, 0.0, 0.0]
  width_y_mm: 76.0
  height_z_mm: 76.0
  thickness_x_mm: 6.0
  corner_radius_mm: 6.0
  body_side_face_x_mm: -32.0
  fork_side_face_x_mm: -26.0
  fork_overlap_x_mm: 4.0
  oversize_checks:
    fork_attachment_width_y_mm: 24.0
    fork_attachment_height_z_mm: 63.4

body_bolt_pattern:
  quantity: 4
  nominal: M4
  clearance_diameter_mm: 4.5
  hole_axis: X
  pattern_y_mm: 60.0
  pattern_z_mm: 60.0
  centers_yz_mm:
    - [-30.0, -30.0]
    - [-30.0, 30.0]
    - [30.0, -30.0]
    - [30.0, 30.0]
  hardware_reference:
    catalog: step.parts
    id: iso4762_socket_head_cap_screw_m4x12
    standard: ISO 4762
    nominal: M4 x 12
    page_url: https://www.step.parts/parts/iso4762_socket_head_cap_screw_m4x12
    sha256: aa75286e34ae2c57fbe6f1eb0e844fe6f9d1d742aa07f034431d94defd09cce7
    included_in_printable_part: false

output:
  source: robot_cad/parts/st3215_hip_body_mount.py
  step: exports/step/st3215_hip_body_mount.step
  stl: exports/stl/st3215_hip_body_mount.stl

acceptance_tests:
  - fused result is one valid connected solid
  - complete reusable motor fork is preserved
  - plate is larger than the connected fork edge in both Y and Z
  - plate has four 4.5 mm through-holes on a symmetric 60 x 60 mm pattern
  - body-side mounting face is flat at X=-32 mm
  - fork-to-plate overlap is positive and continuous

