schema_version: 1
part_id: upper_arm
source: robot_cad/parts/upper_arm.py
reference: vendor/references/so101/Upper_arm_SO101.step
units: mm

coordinate_system:
  convention: immutable SO-101 reference STEP coordinates
  mount_panel_end: negative X
  pose_order: rotate X, rotate Y, rotate Z, then translate

reference_bounds:
  min_xyz_mm: [-65.084989, 0.0, -35.6]
  max_xyz_mm: [78.516747, 24.5, 31.7]

features:
  remove_perforated_mount_panel: true
  mount_panel_cut_plane_x_mm: -29.0
  mount_panel_cut_oversize_mm: 5.0
  add_st3215_rear_motor_bay: true
  motor_bay_center_y_mm: 12.0
  motor_bay_center_z_mm: -1.95
  motor_bay_join_overlap_mm: 0.8
  negative_x_extension_mm: 30.0
  include_positive_x_servo_output_fork: true
  servo_output_fork_cut_plane_x_at_z0_mm: 12.0
  servo_output_fork_cut_plane_slope_x_per_z: 0.0

transition:
  length_mm: 9.0
  bay_embed_mm: 0.4
  end_hold_mm: 1.0
  start_radius_mm: 0.5
  arm_size_y_mm: 24.0
  arm_size_z_mm: 50.0
  arm_radius_mm: 5.0

enlarged_middle_opening:
  enabled: true
  left_cap_center_x_mm: -44.0
  right_cap_center_x_mm: -20.0
  cap_radius_x_mm: 10.0
  height_z_mm: 20.0
  center_z_mm: 0.0
  through_width_overtravel_mm: 1.0

frames:
  frame_st3215_bay_attachment:
    xyz_mm: [-58.2, 12.0, -1.95]
    axis: [1.0, 0.0, 0.0]
  frame_st3215_servo_install:
    xyz_mm: [-69.3117, 12.0, 7.475]
    rotation_xyz_deg: [90.0, 0.0, 0.0]
    axis: [1.0, 0.0, 0.0]
  frame_servo_output_fork_attachment:
    xyz_mm: [12.0, 12.0, 0.0]
    axis: [1.0, 0.0, 0.0]

generated_baseline:
  solid_count: 1
  bounds:
    min_xyz_mm: [-74.2, -3.614304, -35.6]
    max_xyz_mm: [77.084989, 27.614304, 31.7]
    size_xyz_mm: [151.284989, 31.228608, 67.3]
  volume_mm3: 129142.6023015041
  kernel_tolerance_mm: 0.05
  volume_relative_tolerance: 1.0e-5

known_follow_up:
  - confirm the inferred enlarged middle-opening dimensions after physical test fitting
  - confirm ST3215 versus ST3215-HS and the user-supplied STS3212 name before production

acceptance_tests:
  - geometry is valid
  - model contains one connected solid
  - generated bounds match the migrated source
  - the existing middle half-circle is enlarged through the full Y width
  - the enlarged opening remains clear of the motor-bay attachment datum
  - shared motor bay is imported rather than duplicated
  - positive-X output fork is retained as integral upper-arm geometry
  - STEP and STL exports succeed
