    maximum_body_tilt_deg: 20.0
    maximum_base_drop_m: 0.030
    maximum_abs_joint_error_rad: 0.150
    maximum_pd_saturation_fraction: 0.10
    nonfoot_collision_force_threshold_n: 2.0
    contact_on_threshold_n: 1.0
    contact_off_threshold_n: 0.5
