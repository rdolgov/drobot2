schema_version: 1
task:
  id: Drobot-Quadruped-Foot-Lift-v3-Rear-Right-190mm-Balance
  world: exports/isaac/quadruped_robot_manual_world.usda
  world_dependencies:
    - exports/isaac/quadruped_robot_floating.usdc
  robot_prim: /World/Robot
  imu_prim: /World/Robot/Geometry/base_link/body_imu
  # RGB remains evaluation-only. The policy does not consume pixels.
  camera_prim: /World/Robot/Geometry/base_link/lekiwi_camera
  target_velocity_body_m_s: [0.0, 0.0, 0.0]
  physics_hz: 120
  control_hz: 60
  episode_seconds: 8.0
  success_hold_seconds: 0.75
  reset_settle_seconds: 0.75
  reset_start_z_m: 0.46
  reset_joint_noise_rad: 0.003
  foot_lift:
    # Isolate the first rear foot needed by the stair sequence. The environment
    # mirrors the diagonal COM shift from the proven front-left V2 task.
    swing_leg: rear_right
    target_lift_m: 0.19
    reference_lift_m: 0.20
    target_forward_offset_m: 0.11
    # Finish the diagonal weight transfer before unloading the swing foot.
    ramp_start_seconds: 2.50
    ramp_duration_seconds: 3.00
  lift_curriculum:
    mode: timesteps
    levels:
      - id: unload-20mm
        start_fraction: 0.00
        target_lift_m: 0.020
        reference_lift_m: 0.025
      - id: lift-50mm
        start_fraction: 0.30
        target_lift_m: 0.050
        reference_lift_m: 0.060
      - id: lift-90mm
        start_fraction: 0.50
        target_lift_m: 0.090
        reference_lift_m: 0.105
      - id: lift-140mm
        start_fraction: 0.70
        target_lift_m: 0.140
        reference_lift_m: 0.150
      - id: lift-190mm
        start_fraction: 0.85
        target_lift_m: 0.190
        reference_lift_m: 0.200
  base_support:
    mode: none
  weight_shift:
    start_seconds: 0.25
    duration_seconds: 2.00
    # Positive magnitudes are mirrored by the selected swing-leg signs, moving
    # the body into the opposite diagonal support triangle before lift.
    forward_m: 0.045
    lateral_m: 0.045
  success:
    minimum_lift_m: 0.19
    minimum_upright_cosine: 0.9781476  # 12 degrees maximum tilt
    maximum_base_height_error_m: 0.05
    # The commanded weight shift is intentional, not drift.
    maximum_base_displacement_m: 0.08
    maximum_support_foot_lift_m: 0.020
  robot_hardware_profile:
    id: one-leg-real-test-2026-07-28
    evidence:
      - hardware/one-leg-testbed/leg.toml
      - hardware/one-leg-testbed/calibration.json
      - conversations/2026-07-28-one-leg-wall-isaac-revisit.md
    center_tick: 2048
    encoder_directions:
      hip_abduction: 1
      hip_flexion: -1
      knee: -1
    joint_limits_deg:
      hip_abduction: [-45.0, 45.0]
      hip_flexion: [-90.0, 90.0]
      knee: [-120.0, 120.0]
    torque_limit_register: 300
    torque_limit_register_full_scale: 1000
    torque_limit_fraction: 0.30
    stall_torque_nm: 2.941995
    effort_cap_nm: 0.8825985
    speed_register: 350
    speed_register_applied_as_rad_s: false
  nominal_stance:
    down_m: 0.300
    fore_aft_m: 0.025
    abduction_deg: 0.0
  action_scale_rad:
    hip_abduction: 0.12
    hip_flexion: 0.30
    knee: 0.40
  residual_action_scale_rad:
    support:
      hip_abduction: 0.10
      hip_flexion: 0.22
      knee: 0.30
    swing:
      hip_abduction: 0.04
      hip_flexion: 0.08
      knee: 0.12
  termination:
    minimum_base_height_m: 0.24
    minimum_upright_cosine: 0.80
    maximum_base_displacement_m: 0.15
    maximum_support_foot_lift_m: 0.050
  reward:
    lift_tracking_sigma_m: 0.025
    lift_tracking: 6.00
    lift_height: 80.0
    lift_error: -60.0
    lift_progress: 1800.0
    target_hold: 12.00
    upright_deviation: -25.0
    alive: 0.10
    base_height: -12.0
    # Planned diagonal shift is required, so absolute XY drift is not penalized.
    base_drift: 0.0
    support_foot_lift: -60.0
    support_margin: 250.0
    roll_pitch_rate: -0.12
    yaw_rate: -0.10
    action_rate: -0.03
    action_magnitude: -0.01
    joint_velocity: -0.004
    failure: -500.0
    success: 1500.0
ppo:
  total_timesteps: 300000
  learning_rate: 0.00003
  target_kl: 0.03
  rollout_steps: 1024
  batch_size: 128
  epochs: 8
  gamma: 0.997
  gae_lambda: 0.95
  clip_range: 0.20
  entropy_coefficient: 0.001
  value_coefficient: 0.50
  max_gradient_norm: 0.50
  policy_hidden_layers: [256, 256]
  initial_log_std: -2.60
  zero_action_mean_init: true
  checkpoint_frequency_steps: 10000
