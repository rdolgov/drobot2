schema_version: 1
task:
  id: Drobot-Quadruped-Walk-v1
  world: exports/isaac/quadruped_robot_manual_world.usda
  robot_prim: /World/Robot
  imu_prim: /World/Robot/Geometry/base_link/body_imu
  camera_prim: /World/Robot/Geometry/base_link/lekiwi_camera
  target_velocity_body_m_s: [0.15, 0.0, 0.0]
  physics_hz: 120
  control_hz: 60
  episode_seconds: 8.0
  reset_settle_seconds: 0.75
  reset_start_z_m: 0.46
  reset_joint_noise_rad: 0.015
  nominal_stance:
    down_m: 0.310
    fore_aft_m: 0.025
    abduction_deg: 0.0
  action_scale_rad:
    hip_abduction: 0.12
    hip_flexion: 0.30
    knee: 0.40
  termination:
    minimum_base_height_m: 0.22
    minimum_upright_cosine: 0.78
  reward:
    velocity_tracking_sigma_m_s: 0.10
    forward_velocity_tracking: 2.0
    upright: 0.50
    alive: 0.05
    lateral_velocity: -0.50
    vertical_velocity: -0.20
    roll_pitch_rate: -0.05
    yaw_rate: -0.10
    body_height: -2.0
    action_rate: -0.02
    action_magnitude: -0.002
    joint_velocity: -0.005
    termination: -5.0
    target_body_height_m: 0.373
ppo:
  total_timesteps: 500000
  learning_rate: 0.0003
  rollout_steps: 2048
  batch_size: 256
  epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.20
  entropy_coefficient: 0.01
  value_coefficient: 0.50
  max_gradient_norm: 0.50
  policy_hidden_layers: [256, 256]
  checkpoint_frequency_steps: 25000
