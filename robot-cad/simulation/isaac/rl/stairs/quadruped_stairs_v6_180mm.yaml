task:
  id: Drobot-Quadruped-Stairs-v6-180mm
  world: exports/isaac/quadruped_robot_stairs_v6_180mm_world.usda
  world_dependencies:
    - exports/isaac/quadruped_robot_manual_world.usda
    - exports/isaac/quadruped_robot_floating.usdc
  robot_prim: /World/Robot
  imu_prim: /World/Robot/Geometry/base_link/body_imu
  camera_prim: /World/Robot/Geometry/base_link/lekiwi_camera
  target_velocity_body_m_s: [0.10, 0.0, 0.0]
  physics_hz: 120
  control_hz: 120
  episode_seconds: 30.0
  success_hold_seconds: 0.50
  reset_settle_seconds: 0.75
  reset_start_z_m: 0.46
  reset_start_x_range_m: [0.16, 0.22]
  reset_start_y_range_m: [-0.003, 0.003]
  reset_start_yaw_range_deg: [-0.25, 0.25]
  reset_joint_noise_rad: 0.005
  include_navigation_observation: true
  include_foot_progress_observation: true
  foot_placement_tolerance_m: 0.018
  foot_tread_approach_distance_m: 0.22
  foot_placement_sequence: [front_left, front_right, rear_left, rear_right]
  success_minimum_base_elevation_fraction: 0.90
  # A strict v6 pass requires every foot to be on the active goal tread at once.
  success_required_feet_on_goal_tread: 4
  stall_termination:
    enabled: true
    after_seconds: 7.0
    minimum_forward_progress_m: 0.18
    minimum_any_foot_tread_progress: 0.25
  robot_hardware_profile:
    id: one-leg-real-test-2026-07-28
    evidence:
      - hardware/one-leg-testbed/leg.toml
      - hardware/one-leg-testbed/calibration.json
      - conversations/2026-07-28-one-leg-wall-isaac-revisit.md
    center_tick: 2048
    encoder_directions:
      hip_abduction: 1
      hip_flexion: -1
      knee: -1
    joint_limits_deg:
      hip_abduction: [-45.0, 45.0]
      hip_flexion: [-90.0, 90.0]
      knee: [-120.0, 120.0]
    torque_limit_register: 300
    torque_limit_register_full_scale: 1000
    torque_limit_fraction: 0.30
    stall_torque_nm: 2.941995
    effort_cap_nm: 0.8825985
    speed_register: 350
    speed_register_applied_as_rad_s: false
  nominal_stance:
    down_m: 0.310
    fore_aft_m: 0.025
    abduction_deg: 0.0
  # The residual spans the measured joint range needed by the 180 mm IK target.
  action_scale_rad:
    hip_abduction: 0.18
    hip_flexion: 0.60
    knee: 0.90
  residual_policy:
    enabled: true
    base_task_id: Drobot-Quadruped-Walk-v1
    base_model: simulation/isaac/models/ppo-walk-v1-2m/drobot_walk_ppo_final.zip
    base_action_scale_rad:
      hip_abduction: 0.12
      hip_flexion: 0.30
      knee: 0.40
  staircase:
    start_x_m: 0.55
    step_count: 4
    tread_depth_m: 0.25
    rise_m: 0.18
    width_m: 1.00
    top_platform_depth_m: 0.50
    terrain_sample_offsets_m: [-0.15, 0.0, 0.08, 0.16, 0.25, 0.375, 0.50, 0.75]
    terrain_height_normalization_m: 0.36
    goal_distance_normalization_m: 2.00
    goal_margin_m: 0.10
  curriculum:
    mode: mastery
    mastery_window_episodes: 32
    mastery_minimum_episodes: 12
    mastery_success_rate: 0.50
    levels:
      - start_fraction: 0.00
        active_steps: 1
      - start_fraction: 0.25
        active_steps: 2
      - start_fraction: 0.50
        active_steps: 3
      - start_fraction: 0.75
        active_steps: 4
  progress_watchdog:
    enabled: true
    report_interval_steps: 5000
    initial_gate_steps: 100000
    minimum_completed_episodes: 30
    minimum_first_step_climb_episodes: 3
    minimum_first_step_climb_rate: 0.02
    minimum_base_elevation_gain_m: 0.10
    stagnation_abort_steps: 300000
  termination:
    minimum_base_clearance_m: 0.18
    minimum_upright_cosine: 0.75
    maximum_lateral_deviation_m: 0.35
    minimum_world_x_m: -0.30
  reward:
    velocity_tracking_sigma_m_s: 0.10
    subtract_zero_velocity_tracking: true
    forward_velocity_tracking: 0.50
    forward_progress: 80.0
    base_height_gain: 450.0
    terrain_height_gain: 120.0
    upright: 0.15
    upright_deviation: -10.0
    alive: -0.18
    centerline: -10.0
    lateral_velocity: -0.50
    heading_error: -0.80
    vertical_velocity: -0.02
    roll_pitch_rate: -0.03
    yaw_rate: -0.08
    body_clearance: -3.0
    action_rate: -0.01
    action_magnitude: -0.02
    joint_velocity: -0.002
    foot_lift_progress: 200.0
    foot_tread_progress: 900.0
    foot_step_placement: 1000.0
    foot_tread_support: 2.0
    failure: -4000.0
    success: 10000.0
    target_body_clearance_m: 0.373
ppo:
  total_timesteps: 3000000
  learning_rate: 0.00003
  target_kl: 0.03
  rollout_steps: 2048
  batch_size: 256
  epochs: 10
  gamma: 0.998
  gae_lambda: 0.95
  clip_range: 0.20
  entropy_coefficient: 0.003
  value_coefficient: 0.50
  max_gradient_norm: 0.50
  policy_hidden_layers: [256, 256]
  initial_log_std: -1.40
  zero_action_mean_init: true
  checkpoint_frequency_steps: 25000
