schema_version: 1
task:
  id: Drobot-Quadruped-Stairs-v41-Staged-Rear-Right-Landing
  world: exports/isaac/quadruped_robot_stairs_v6_180mm_world.usda
  world_dependencies:
    - exports/isaac/quadruped_robot_manual_world.usda
    - exports/isaac/quadruped_robot_floating.usdc
  robot_prim: /World/Robot
  imu_prim: /World/Robot/Geometry/base_link/body_imu
  camera_prim: /World/Robot/Geometry/base_link/lekiwi_camera
  # Blind fixed-geometry rear-right landing task. V41 preserves the verified
  # V38 transfer/lift and releases only the cleared swing foot's forward world
  # anchor as the body advances. RGB pixels remain out of the policy.
  target_velocity_body_m_s: [0.0, 0.0, 0.0]
  physics_hz: 120
  control_hz: 60
  episode_seconds: 65.0
  success_hold_seconds: 0.75
  reset_settle_seconds: 0.75
  reset_start_z_m: 0.46
  reset_start_x_range_m: [0.3361109582, 0.3421109582]
  reset_start_y_range_m: [-0.0021876550, 0.0038123450]
  reset_start_yaw_range_deg: [-0.4131287166, 0.5868712834]
  reset_joint_noise_rad: 0.003
  reset_joint_offsets_rad:
    - -0.0027938977
    - -0.0024945535
    - 0.0017021899
    - -0.0011947560
    - 0.0006370381
    - -0.0019738669
    - -0.0020031606
    - 0.0008928371
    - 0.0004912728
    - 0.0008375710
    - -0.0007811296
    - -0.0029836656
  include_navigation_observation: true
  include_foot_progress_observation: true
  include_placement_reference_observation: true
  include_support_regulation_observation: true
  foot_placement_tolerance_m: 0.018
  foot_tread_approach_distance_m: 0.25
  foot_placement_sequence: [front_right, front_left, rear_right, rear_left]
  success_minimum_base_elevation_fraction: 0.0
  success_required_feet_on_goal_tread: 0
  stall_termination:
    enabled: false
  placement_reference:
    enabled: true
    # This bounded experiment extends the accepted V38 rear-right lift through
    # a force-backed landing on the exact 250 mm tread. Rear-left transfer is
    # still excluded so landing stability is evaluated before the next skill.
    sequence_legs: [front_right, front_left, rear_right]
    completed_leg_hold_mode: all_feet_anchored_incenter_transfer
    success_mode: tread_contact
    # Do not begin forward swing until the measured foot tip clears the full
    # 190 mm requirement. A bounded hold turns low-clearance cases into an
    # upright training failure instead of allowing lateral advance and a tip.
    advance_clearance_gate:
      enabled: true
      legs: [front_left, rear_right]
      minimum_clearance_m: 0.190
      maximum_hold_seconds: 2.00
    level_override_by_leg:
      front_right:
        success_mode: tread_contact
        apex_lift_m: 0.205
        landing_lift_m: 0.145
        lift_forward_offset_m: 0.110
        swing_forward_offset_m: 0.210
        landing_forward_offset_m: 0.190
        target_tread_fraction: 0.24
        contact_hold_seconds: 0.75
      rear_right:
        # Preserve V38's folded 50 mm lift pose and exact 190 mm physical gate.
        # Cached-state V39 search found that 210-360 mm commands remained short
        # of the x=0.550 m tread edge; 380 mm produced force-backed edge contact.
        # V40 freezes the verified V38 support controller and trains only a
        # compact rear-right swing residual, allowing hip/knee coordination to
        # move the foot center beyond the riser without replacing COM balance.
        success_mode: tread_contact
        minimum_lift_m: 0.190
        minimum_support_margin_m: 0.015
        apex_lift_m: 0.235
        landing_lift_m: 0.125
        lift_forward_offset_m: 0.050
        swing_forward_offset_m: 0.380
        landing_forward_offset_m: 0.360
        target_tread_fraction: 0.08
        contact_hold_seconds: 0.75
      rear_left:
        lift_forward_offset_m: 0.050
    timing:
      shift_start_seconds: 0.25
      shift_duration_seconds: 2.00
      lift_start_seconds: 2.50
      lift_duration_seconds: 3.00
      advance_start_seconds: 5.50
      advance_duration_seconds: 4.00
      lower_start_seconds: 9.50
      lower_duration_seconds: 1.50
    timing_override_by_leg:
      rear_right:
        # Spend four seconds shifting the cleared three-foot body, then retain
        # the full proven four-second swing advance before touchdown.
        advance_duration_seconds: 8.00
        lower_start_seconds: 13.50
        lower_duration_seconds: 2.50
      front_left:
        shift_start_seconds: 0.00
        shift_duration_seconds: 0.50
        lift_start_seconds: 0.50
        # V22 search slows the torque-capped lift before forward advance.
        lift_duration_seconds: 3.00
        advance_start_seconds: 3.50
        advance_duration_seconds: 3.00
        lower_start_seconds: 6.50
        lower_duration_seconds: 1.50
    weight_shift:
      forward_m: 0.045
      lateral_m: 0.045
      scale_by_leg:
        front_right: 1.0
        front_left: 0.35
    inter_leg_transfer:
      enabled: true
      duration_seconds: 4.00
      unload_duration_seconds: 3.00
      maximum_seconds: 10.00
      override_by_next_swing_leg:
        rear_right:
          duration_seconds: 8.00
          unload_duration_seconds: 3.00
          maximum_seconds: 18.00
          # V38 search seed 832 completed with 39.9 mm minimum margin from
          # unload onward. Require a positive 15 mm safety margin; the old
          # permissive -10 mm rear-right exception is intentionally removed.
          minimum_support_margin_m: 0.015
          # Uninterrupted seed-844 replay sustains 3.87 N before unload. Use a
          # rear-right-specific 3 N contact gate for 0.5 s; every other leg
          # keeps the global 5 N preload requirement below.
          minimum_next_swing_preload_n: 3.0
          # The nominal 120 mm unload passed cached-state validation but kept
          # 3.87 N on the rear foot during uninterrupted seed-844 replay.
          # Add 20 mm of handoff clearance; the independent 190 mm stair-
          # clearance gate remains unchanged.
          swing_unload_lift_m: 0.140
          base_target_tolerance_m: 0.025
          # Use the same 12 degree envelope during transfer and placement.
          minimum_upright_cosine: 0.9781476
        rear_left:
          duration_seconds: 8.00
          unload_duration_seconds: 3.00
          maximum_seconds: 18.00
          minimum_support_margin_m: -0.010
          swing_unload_lift_m: 0.120
          base_target_tolerance_m: 0.025
          minimum_upright_cosine: 0.9723699
      gate_hold_seconds: 0.40
      pre_unload_gate_hold_seconds: 0.50
      minimum_next_swing_preload_n: 5.0
      support_incenter_blend: 0.85
      minimum_support_margin_m: 0.025
      base_target_tolerance_m: 0.020
      maximum_base_speed_m_s: 0.020
      maximum_body_rate_rad_s: 0.200
      maximum_forward_shift_m: 0.080
      maximum_backward_shift_m: 0.050
      maximum_lateral_shift_m: 0.120
      target_offset_m:
        forward: 0.000
        lateral: 0.000
      # Close the loop on the mass-weighted whole-robot COM, not merely the
      # base-link origin. The target is recomputed from the three stance feet
      # and remains blind/proprioceptive: link poses come from joint state and
      # the mounted IMU, while no camera pixels enter the policy.
      com_regulation:
        enabled: true
        balance_point: composite_com
        pitch_attitude_feedback:
          enabled: true
          # V35 must level the body while the front pair is one full rise
          # above the rear pair, before unloading either rear foot.
          apply_during_inter_leg_transfer: true
          inter_leg_transfer_legs: [rear_right, rear_left]
          # During a rear transfer, extending the sole rear stance leg uses
          # the reach needed for the forward COM shift. Shorten only the two
          # front stance legs; the rear leg remains inside its 400 mm reach.
          inter_leg_transfer_front_only: true
          inter_leg_transfer_proportional_gain_m: 0.300
          inter_leg_transfer_maximum_correction_m: 0.100
          # Preserve V36's front-only catch for two seconds, then blend V35's
          # rear-stance pitch authority over two seconds. This avoids the
          # immediate reference discontinuity while restoring the reach needed
          # to move beyond V36's 150 mm lift plateau.
          front_only_by_swing_leg: []
          front_only_seconds_by_swing_leg:
            rear_right: 2.0
            rear_left: 2.0
          rear_blend_seconds_by_swing_leg:
            rear_right: 2.0
            rear_left: 2.0
          proportional_gain_m: 0.080
          maximum_correction_m: 0.025
        target_incenter_blend: 1.0
        target_offset_m:
          forward: 0.000
          lateral: 0.000
        target_offset_by_swing_leg:
          front_left:
            forward: 0.000
            lateral: 0.000
          rear_right:
            # Deterministic cached-state search: adding 20 mm forward and
            # 40 mm toward the remaining rear-left stance foot changed the
            # handoff from -7.5 mm to +40.6 mm completion margin and reduced
            # transfer tilt from 12.49 to 10.37 degrees.
            forward: 0.020
            lateral: 0.040
        hold_target_offset_by_swing_leg:
          front_left:
            # Once the left foot reaches the tread, move the retained COM
            # target 15 mm toward the front pair so the new contact remains
            # load-bearing instead of bouncing and unloading behind the COM.
            forward: 0.015
            lateral: 0.000
        support_squat_thrust_by_swing_leg:
          front_left:
            legs: [rear_left, rear_right]
            crouch_m: 0.035
            release_lift_fraction: 0.25
        # V22 full-sequence result: lengthen only the already placed
        # front-right support reference during the left-foot shift/lift. The
        # 50 mm candidate reached 221.0 mm with 13.5 mm slip and 9.7 deg tilt.
        support_extension_m_by_swing_leg:
          front_left:
            front_right: 0.050
        maximum_correction_m:
          forward: 0.080
          lateral: 0.120
        # V38's positive-margin target needs 100 mm of forward COM authority.
        # This is the smallest searched increase that passed the strict gate;
        # rear-left remains at the older bound until it is tested separately.
        maximum_correction_m_by_swing_leg:
          rear_right:
            forward: 0.100
            lateral: 0.120
          rear_left:
            forward: 0.080
            lateral: 0.120
        maximum_feedback_correction_m:
          forward: 0.025
          lateral: 0.052
          vertical: 0.020
        transfer_feedback_gain:
          forward: 1.00
          lateral: 1.20
          vertical: 1.00
        feedback_gain:
          forward: 1.00
          lateral: 1.20
          vertical: 1.00
      support_world_anchor_follow_gain: 0.0
      support_world_anchor_follow_gain_xyz:
        forward: 0.0
        lateral: 0.0
        vertical: 0.0
      post_transfer_swing_reference_mode: blend_to_nominal_stance
      post_transfer_swing_reference_mode_by_leg:
        # Each rear leg is already 120 mm clear when its transfer gate opens.
        # Preserve that measured unloaded pose and add only the remaining lift;
        # blending back to nominal consumed the real-cap hip-flexion authority.
        rear_right: phase_baseline
        rear_left: phase_baseline
      post_clearance_swing_base_delta_end_scale_by_leg:
        # Keep the V38 world-anchored raise intact until the exact 190 mm gate
        # releases. During forward advance, let the already-stable 20 mm COM
        # translation carry the foot beyond the x=0.550 m riser edge. Lateral
        # and vertical anchoring remain unchanged.
        rear_right:
          forward: 0.0
          lateral: 1.0
          vertical: 1.0
      post_clearance_body_shift_by_leg:
        # Begin only after the exact 190 mm gate releases. The three stance
        # legs move the whole-robot COM forward 20 mm during advance while the
        # staged swing anchor lets that motion carry rear-right onto the tread.
        rear_right:
          forward_m: 0.010
          lateral_m: 0.000
          body_shift_fraction_of_advance: 0.50
      support_base_error_feedback_gain:
        forward: 1.0
        lateral: 0.0
        vertical: 1.0
      swing_unload_lift_m: 0.080
      maximum_swing_unloaded_load_n: 1.0
      post_transfer_weight_shift:
        forward_m: 0.000
        lateral_m: 0.000
      # PPO may correct only the three stance legs during a learned transfer.
      # The first 0.15-scale seed-843 run preserved margin but reduced the
      # rear-right preload below the 5 N gate. Keep the analytic positive-
      # margin transfer dominant: 0.02 bounds full-scale PPO correction to
      # 0.29 deg abduction, 0.25 deg flexion, and 0.34 deg knee per support
      # joint. The failed larger-authority run remains negative evidence.
      residual_action_scale: 0.02
      # V37's support policy owns the complete rear-right phase, rather than a
      # fixed-duration post-transfer overlay.
      policy_post_hold_seconds: 0.0
      # Post-gate PPO must see the same nonzero body/joint rates present in a
      # continuous composed episode. Zeroing and settling the cached snapshot
      # produced an easier state that did not transfer back to evaluation.
      phase_snapshot_restore_zero_velocities: false
      phase_snapshot_restore_settle_control_steps: 0
    target_x_tolerance_m: 0.065
    # The foot-link origin is not the sole contact point. With the real-test
    # collision geometry pitched on the tread, force-backed equilibrium puts
    # that origin about 27 mm above the analytic 180 mm surface. Keep the
    # step-specific force test authoritative and allow 32 mm of frame-height
    # tolerance; this does not change the 190 mm measured lift gate.
    target_z_tolerance_m: 0.032
    minimum_lift_m: 0.190
    minimum_lift_support_margin_m: 0.015
    contact_on_threshold_n: 1.0
    contact_load_normalization_n: 50.0
    minimum_success_upright_cosine: 0.9781476
    measurable_slip_threshold_m: 0.025
  placement_curriculum:
    mode: mastery
    mastery_successes_per_level: 2
    levels:
      - id: left-supported-015mm-lift
        start_fraction: 0.00
        success_mode: swing_lift_hold
        minimum_lift_m: 0.015
        minimum_support_margin_m: 0.003
        apex_lift_m: 0.065
        landing_lift_m: 0.040
        lift_forward_offset_m: 0.020
        swing_forward_offset_m: 0.020
        landing_forward_offset_m: 0.020
        target_tread_fraction: 0.24
        contact_hold_seconds: 0.50
        lift_hold_seconds: 0.50
      - id: left-supported-035mm-lift
        start_fraction: 0.12
        success_mode: swing_lift_hold
        minimum_lift_m: 0.035
        minimum_support_margin_m: 0.008
        apex_lift_m: 0.145
        landing_lift_m: 0.100
        lift_forward_offset_m: 0.035
        swing_forward_offset_m: 0.035
        landing_forward_offset_m: 0.035
        target_tread_fraction: 0.24
        contact_hold_seconds: 0.50
        lift_hold_seconds: 0.50
      - id: left-supported-060mm-lift
        start_fraction: 0.24
        success_mode: swing_lift_hold
        minimum_lift_m: 0.060
        minimum_support_margin_m: 0.010
        apex_lift_m: 0.185
        landing_lift_m: 0.125
        lift_forward_offset_m: 0.050
        swing_forward_offset_m: 0.050
        landing_forward_offset_m: 0.050
        target_tread_fraction: 0.24
        contact_hold_seconds: 0.50
        lift_hold_seconds: 0.50
      - id: left-supported-100mm-lift
        start_fraction: 0.36
        success_mode: swing_lift_hold
        minimum_lift_m: 0.100
        minimum_support_margin_m: 0.012
        apex_lift_m: 0.205
        landing_lift_m: 0.145
        lift_forward_offset_m: 0.065
        swing_forward_offset_m: 0.065
        landing_forward_offset_m: 0.065
        target_tread_fraction: 0.24
        contact_hold_seconds: 0.50
        lift_hold_seconds: 0.50
      - id: left-supported-140mm-lift
        start_fraction: 0.48
        success_mode: swing_lift_hold
        minimum_lift_m: 0.140
        minimum_support_margin_m: 0.012
        apex_lift_m: 0.205
        landing_lift_m: 0.145
        lift_forward_offset_m: 0.080
        swing_forward_offset_m: 0.080
        landing_forward_offset_m: 0.080
        target_tread_fraction: 0.24
        contact_hold_seconds: 0.50
        lift_hold_seconds: 0.50
      - id: left-supported-190mm-lift
        start_fraction: 0.60
        success_mode: swing_lift_hold
        minimum_lift_m: 0.190
        minimum_support_margin_m: 0.015
        # Add physical clearance margin above the 190 mm release threshold.
        # V30 misses showed torque-limited flexion tracking, not COM or slip
        # failure, so the reference and reward now target the measured height.
        apex_lift_m: 0.220
        landing_lift_m: 0.145
        # At the verified 120-degree knee limit, this forward rotation is
        # needed to reduce vertical leg extension enough for a 190 mm world
        # lift. Pre-unload and COM feedback now isolate it from support drift.
        lift_forward_offset_m: 0.120
        swing_forward_offset_m: 0.120
        landing_forward_offset_m: 0.120
        target_tread_fraction: 0.24
        contact_hold_seconds: 0.50
        lift_hold_seconds: 0.50
      - id: left-near-edge-force-touch
        start_fraction: 0.72
        success_mode: tread_contact
        apex_lift_m: 0.195
        landing_lift_m: 0.145
        lift_forward_offset_m: 0.110
        swing_forward_offset_m: 0.160
        landing_forward_offset_m: 0.155
        target_tread_fraction: 0.12
        contact_hold_seconds: 0.25
      - id: left-quarter-tread-load
        start_fraction: 0.84
        success_mode: tread_contact
        apex_lift_m: 0.200
        landing_lift_m: 0.145
        lift_forward_offset_m: 0.110
        swing_forward_offset_m: 0.195
        landing_forward_offset_m: 0.180
        target_tread_fraction: 0.25
        contact_hold_seconds: 0.50
      - id: left-center-tread-load
        start_fraction: 0.94
        success_mode: tread_contact
        # The IMU leveling loop changes the swing foot's world-height mapping.
        # Preserve the exact 190 mm measured gate, but command 45 mm headroom
        # so real-cap tracking variation cannot block forward advance.
        apex_lift_m: 0.235
        # Pitch leveling keeps the body higher over the front-left landing.
        # Lower 20 mm farther after the 190 mm clearance gate so force-backed
        # tread contact can persist for the complete 0.75 s acceptance hold.
        landing_lift_m: 0.125
        lift_forward_offset_m: 0.110
        swing_forward_offset_m: 0.210
        landing_forward_offset_m: 0.190
        # The 190 mm landing reference settles at x~=0.675 m, the physical
        # center of the exact 250 mm tread that starts at x=0.550 m.
        target_tread_fraction: 0.50
        contact_hold_seconds: 0.75
  foot_contact_material:
    # Enabled only after the 140 mm target produced 104-124 mm of support-foot
    # slip, well above the declared 25 mm measurable-slip threshold.
    enabled: true
    id: rubber-pad-v24-conservative-support-regulation
    static_friction: 1.20
    dynamic_friction: 1.00
    friction_combine_mode: average
    restitution: 0.02
    compliant_contact_stiffness: 12000.0
    compliant_contact_damping: 45.0
  robot_hardware_profile:
    id: one-leg-real-test-2026-07-28
    evidence:
      - hardware/one-leg-testbed/leg.toml
      - hardware/one-leg-testbed/calibration.json
      - conversations/2026-07-28-one-leg-wall-isaac-revisit.md
    center_tick: 2048
    encoder_directions:
      hip_abduction: 1
      hip_flexion: -1
      knee: -1
    joint_limits_deg:
      hip_abduction: [-45.0, 45.0]
      hip_flexion: [-90.0, 90.0]
      knee: [-120.0, 120.0]
    torque_limit_register: 300
    torque_limit_register_full_scale: 1000
    torque_limit_fraction: 0.30
    stall_torque_nm: 2.941995
    effort_cap_nm: 0.8825985
    speed_register: 350
    speed_register_applied_as_rad_s: false
  nominal_stance:
    down_m: 0.300
    fore_aft_m: 0.025
    abduction_deg: 0.0
  action_scale_rad:
    hip_abduction: 0.04
    hip_flexion: 0.08
    knee: 0.12
  placement_residual_action_scale_rad:
    support:
      # The composed front-right phase needs additional support abduction to
      # finish in a transfer-stable stance.  This is intentionally distinct
      # from the standalone v10 contract and is isolated from the next leg.
      hip_abduction: 0.25
      hip_flexion: 0.22
      knee: 0.30
    swing:
      hip_abduction: 0.04
      hip_flexion: 0.08
      knee: 0.12
    override_by_swing_leg:
      front_left:
        # Match the verified v15 left-lift action contract so that policy can
        # be reused as the frozen swing/balance base for placement training.
        support:
          hip_abduction: 0.10
          hip_flexion: 0.22
          knee: 0.30
  residual_policy:
    enabled: false
  staircase:
    start_x_m: 0.55
    step_count: 4
    tread_depth_m: 0.25
    rise_m: 0.18
    width_m: 1.00
    top_platform_depth_m: 0.50
    terrain_sample_offsets_m: [-0.15, 0.0, 0.08, 0.16, 0.25, 0.375, 0.50, 0.75]
    terrain_height_normalization_m: 0.36
    goal_distance_normalization_m: 2.00
    goal_margin_m: 0.10
  curriculum:
    mode: timesteps
    levels:
      - start_fraction: 0.00
        active_steps: 1
  progress_watchdog:
    enabled: false
  termination:
    minimum_base_clearance_m: 0.22
    minimum_upright_cosine: 0.94
    # Match training termination to the acceptance envelope so long drifting
    # episodes cannot outscore an earlier successful lift.
    maximum_lateral_deviation_m: 0.20
    lateral_deviation_tolerance_m: 0.001
    minimum_world_x_m: 0.05
  reward:
    velocity_tracking_sigma_m_s: 0.10
    subtract_zero_velocity_tracking: false
    forward_velocity_tracking: 0.0
    forward_progress: 0.0
    base_height_gain: 0.0
    terrain_height_gain: 0.0
    upright: 0.5
    # The V31 swing-only controller touched the tread but rolled to 13.9 deg,
    # beyond the 12 deg success envelope. Make attitude and support geometry
    # first-class objectives for the compact support-regulation policy.
    upright_deviation: -300.0
    alive: 0.05
    centerline: -1000.0
    lateral_velocity: -3.0
    heading_error: -0.5
    vertical_velocity: -0.03
    roll_pitch_rate: -10.0
    yaw_rate: -0.08
    body_clearance: -4.0
    action_rate: -0.10
    action_magnitude: -0.10
    joint_velocity: -0.004
    foot_lift_progress: 1200.0
    foot_tread_progress: 600.0
    foot_step_placement: 1000.0
    foot_tread_support: 0.0
    swing_target_tracking_sigma_m: 0.035
    # Landing-target tracking conflicts with the higher lift apex: the tread
    # surface is below the clearance-gated swing target. Track the live phase
    # height instead and directly penalize deficit only while the gate holds.
    swing_target_tracking: 0.0
    swing_height_tracking_sigma_m: 0.018
    swing_height_tracking: 18.0
    clearance_gate_deficit: -6000.0
    tread_contact: 25.0
    support_contact: 2.0
    support_slip: -1000.0
    support_margin: 500.0
    balance_target_error: -50.0
    minimum_support_load: 3.0
    pd_effort_saturation: -1.00
    failure: -15000.0
    success: 5000.0
    target_body_clearance_m: 0.36
ppo:
  total_timesteps: 200000
  # Exact same-shape initialization comes from the accepted V38 support policy;
  # keep optimizer motion local while extending the lift through tread contact.
  learning_rate: 0.00001
  target_kl: 0.006
  rollout_steps: 512
  batch_size: 64
  epochs: 8
  gamma: 0.997
  gae_lambda: 0.95
  clip_range: 0.15
  entropy_coefficient: 0.0
  value_coefficient: 0.50
  max_gradient_norm: 0.50
  policy_hidden_layers: [256, 256]
  initial_log_std: -4.00
  zero_action_mean_init: true
  checkpoint_frequency_steps: 512
