[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "drobot-hardware-test-apps"
version = "0.1.0"
description = "Local hardware commissioning dashboards for Drobot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "drobot-one-leg-testbed==0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.12,<1.0",
]

[project.scripts]
drobot-four-leg-web = "drobot_hardware_test_apps.four_leg_control:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drobot_hardware_test_apps = ["four_leg_static/*.html", "four_leg_static/*.css", "four_leg_static/*.js"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
