schema_version: 1
task:
  id: Drobot-Quadruped-Stairs-v1
  world: simulation/exports/isaac/quadruped_robot_stairs_world.usda
  world_dependencies:
    - simulation/exports/isaac/quadruped_robot_manual_world.usda
    - simulation/exports/isaac/quadruped_robot_floating.usdc
  robot_prim: /World/Robot
  imu_prim: /World/Robot/Geometry/base_link/body_imu
  camera_prim: /World/Robot/Geometry/base_link/lekiwi_camera
  target_velocity_body_m_s: [0.11, 0.0, 0.0]
  physics_hz: 120
  control_hz: 60
  episode_seconds: 22.0
  success_hold_seconds: 0.50
  reset_settle_seconds: 0.75
  reset_start_z_m: 0.46
  reset_start_x_range_m: [-0.65, -0.55]
  reset_start_y_range_m: [-0.03, 0.03]
  reset_start_yaw_range_deg: [-2.0, 2.0]
  reset_joint_noise_rad: 0.015
  nominal_stance:
    down_m: 0.310
    fore_aft_m: 0.025
    abduction_deg: 0.0
  action_scale_rad:
    hip_abduction: 0.14
    hip_flexion: 0.36
    knee: 0.48
  staircase:
    start_x_m: 0.55
    step_count: 4
    tread_depth_m: 0.23
    rise_m: 0.04
    width_m: 1.00
    top_platform_depth_m: 0.50
    terrain_sample_offsets_m: [-0.15, 0.0, 0.10, 0.20, 0.30, 0.45, 0.60, 0.85]
    terrain_height_normalization_m: 0.12
    goal_distance_normalization_m: 2.40
    goal_margin_m: 0.10
  curriculum:
    levels:
      - start_fraction: 0.00
        active_steps: 1
      - start_fraction: 0.12
        active_steps: 2
      - start_fraction: 0.28
        active_steps: 3
      - start_fraction: 0.48
        active_steps: 4
  termination:
    minimum_base_clearance_m: 0.20
    minimum_upright_cosine: 0.70
    maximum_lateral_deviation_m: 0.48
    minimum_world_x_m: -1.20
  reward:
    velocity_tracking_sigma_m_s: 0.10
    forward_velocity_tracking: 1.25
    forward_progress: 40.0
    terrain_height_gain: 100.0
    upright: 0.40
    alive: 0.03
    centerline: -0.80
    vertical_velocity: -0.08
    roll_pitch_rate: -0.04
    yaw_rate: -0.08
    body_clearance: -4.0
    action_rate: -0.02
    action_magnitude: -0.002
    joint_velocity: -0.004
    failure: -10.0
    success: 400.0
    target_body_clearance_m: 0.373
ppo:
  total_timesteps: 3000000
  learning_rate: 0.00025
  rollout_steps: 2048
  batch_size: 256
  epochs: 10
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.20
  entropy_coefficient: 0.012
  value_coefficient: 0.50
  max_gradient_norm: 0.50
  policy_hidden_layers: [256, 256]
  checkpoint_frequency_steps: 50000
