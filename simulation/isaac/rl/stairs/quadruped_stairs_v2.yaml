schema_version: 1
task:
  id: Drobot-Quadruped-Stairs-v2
  world: simulation/exports/isaac/quadruped_robot_stairs_v2_world.usda
  world_dependencies:
    - simulation/exports/isaac/quadruped_robot_manual_world.usda
    - simulation/exports/isaac/quadruped_robot_floating.usdc
  robot_prim: /World/Robot
  imu_prim: /World/Robot/Geometry/base_link/body_imu
  camera_prim: /World/Robot/Geometry/base_link/lekiwi_camera
  target_velocity_body_m_s: [0.11, 0.0, 0.0]
  physics_hz: 120
  control_hz: 60
  episode_seconds: 18.0
  success_hold_seconds: 0.50
  reset_settle_seconds: 0.75
  reset_start_z_m: 0.46
  reset_start_x_range_m: [0.18, 0.24]
  reset_start_y_range_m: [-0.01, 0.01]
  reset_start_yaw_range_deg: [-0.75, 0.75]
  reset_joint_noise_rad: 0.015
  include_navigation_observation: true
  nominal_stance:
    down_m: 0.310
    fore_aft_m: 0.025
    abduction_deg: 0.0
  action_scale_rad:
    hip_abduction: 0.14
    hip_flexion: 0.36
    knee: 0.48
  staircase:
    start_x_m: 0.55
    step_count: 4
    tread_depth_m: 0.23
    rise_m: 0.04
    width_m: 1.00
    top_platform_depth_m: 0.50
    terrain_sample_offsets_m: [-0.10, 0.0, 0.08, 0.16, 0.24, 0.32, 0.45, 0.60]
    terrain_height_normalization_m: 0.12
    goal_distance_normalization_m: 1.60
    goal_margin_m: 0.10
  curriculum:
    mode: mastery
    mastery_window_episodes: 40
    mastery_minimum_episodes: 20
    mastery_success_rate: 0.70
    levels:
      - start_fraction: 0.00
        active_steps: 1
      - start_fraction: 0.25
        active_steps: 2
      - start_fraction: 0.50
        active_steps: 3
      - start_fraction: 0.75
        active_steps: 4
  progress_watchdog:
    enabled: true
    report_interval_steps: 10000
    initial_gate_steps: 100000
    minimum_completed_episodes: 40
    minimum_first_step_climb_episodes: 3
    minimum_first_step_climb_rate: 0.02
    minimum_base_elevation_gain_m: 0.02
    stagnation_abort_steps: 300000
  termination:
    minimum_base_clearance_m: 0.20
    minimum_upright_cosine: 0.70
    maximum_lateral_deviation_m: 0.30
    minimum_world_x_m: -0.30
  reward:
    velocity_tracking_sigma_m_s: 0.10
    forward_velocity_tracking: 1.00
    forward_progress: 60.0
    base_height_gain: 150.0
    terrain_height_gain: 40.0
    upright: 0.40
    alive: 0.01
    centerline: -8.0
    lateral_velocity: -0.50
    heading_error: -0.60
    vertical_velocity: -0.04
    roll_pitch_rate: -0.04
    yaw_rate: -0.08
    body_clearance: -4.0
    action_rate: -0.02
    action_magnitude: -0.002
    joint_velocity: -0.004
    failure: -10.0
    success: 400.0
    target_body_clearance_m: 0.373
ppo:
  total_timesteps: 3000000
  # Stair rewards are much sharper than the flat-walk task. Fine-tune
  # conservatively and stop an epoch early if a PPO update moves too far.
  learning_rate: 0.00005
  target_kl: 0.03
  rollout_steps: 2048
  batch_size: 256
  epochs: 10
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.20
  entropy_coefficient: 0.002
  value_coefficient: 0.50
  max_gradient_norm: 0.50
  policy_hidden_layers: [256, 256]
  initial_log_std: -0.70
  checkpoint_frequency_steps: 25000
