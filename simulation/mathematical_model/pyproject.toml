[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drobot-mathematical-model"
version = "0.1.0"
description = "Readable NumPy kinematics and rigid-body dynamics for Drobot2."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "ipykernel>=6", "matplotlib>=3.7", "sympy>=1.12"]

[tool.setuptools.packages.find]
where = ["."]
include = ["drobot_model*"]
