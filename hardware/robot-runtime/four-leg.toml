[server]
http_port = 8766
ramp_rate_deg_s = 45.0
heartbeat_timeout_s = 3.0

[monitoring]
voltage_warning_low_v = 10.5
voltage_warning_high_v = 12.6
voltage_spread_warning_v = 0.5
temperature_warning_c = 60
leg_current_warning_ma = 3000.0

[crawl]
period_s = 20.0
cycles = 1
stance_settle_s = 1.5
stride_m = 0.028
lift_m = 0.014
weight_shift_forward_m = 0.016
weight_shift_lateral_m = 0.0
stance_down_m = 0.305
stance_fore_aft_m = 0.025
abduction_deg = 0.0
start_tolerance_deg = 35.0

[[legs]]
number = 1
label = "Leg 1 / Front left"
corner = "front_left"
profile = "servos/leg-1.toml"
calibration = "servos/calibration-leg-1.json"

[[legs]]
number = 2
label = "Leg 2 / Front right"
corner = "front_right"
profile = "servos/leg-2.toml"
calibration = "servos/calibration-leg-2.json"

[[legs]]
number = 3
label = "Leg 3 / Rear left"
corner = "rear_left"
profile = "servos/leg-3.toml"
calibration = "servos/calibration-leg-3.json"

[[legs]]
number = 4
label = "Leg 4 / Rear right"
corner = "rear_right"
profile = "servos/leg-4.toml"
calibration = "servos/calibration-leg-4.json"
